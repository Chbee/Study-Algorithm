name: Update Progress

on:
  workflow_run:
    workflows: ["Update Day README"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'Practice' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Update root README
        run: python3 .github/scripts/update_progress.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "update: README.md 파일 최신화"
            git push
          fi
