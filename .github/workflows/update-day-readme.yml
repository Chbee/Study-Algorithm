name: Update Day README

on:
  push:
    branches:
      - Practice
    paths:
      - "**/*.swift"

jobs:
  update-day-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Update README from headers
        run: |
            python3 .github/scripts/update-day-readme.py \
              --base "${{ github.event.before }}" \
              --head "${{ github.sha }}"

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
              echo "No Changes to commit"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add **/README.md
          git commit -m "update: README 파일 최신화"
          git push
